[package]
name = "process-scoping-poc"
description = "Proof of concept comparing ways to start sub-agent processes inside a cgroup on Linux"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "signal"] }
thiserror = { workspace = true }
zbus_systemd = { version = "0.26201.0", default-features = false, features = ["systemd1", "zbus-async-zruntime"] }
