namespace: newrelic
name: com.newrelic.infrastructure.nri_memcached
version: 0.1.0
platform: host
operating_system: linux
protocol_version: "1.0"
variables:
  config:
    description: "nri-memcached integration YAML consumed by the infra-agent"
    type: yaml
    required: true
  version:
    description: "Agent version"
    type: string
    required: true
  oci:
    repository:
      description: "OCI repository name for nri-memcached"
      type: string
      required: false
      default: newrelic/nri-memcached-artifacts
      variants:
        ac_config_field: "oci_repository_urls"
        values: [ "newrelic/nri-memcached-artifacts" ]
deployment:
  packages:
    nri-memcached:
      download:
        oci:
          repository: ${nr-var:oci.repository}
          version: ${nr-var:version}
          public_key_url: https://publickeys.newrelic.com/g/agent-control-oci/global/nri-memcached/jwks.json
  shared_filesystem:
    infra-agent-ohi-configs:
      kind: dir
      entries:
        nri-memcached.yaml:
          kind: file
          text: |
            ${nr-var:config}
    infra-agent-ohi-binaries:
      kind: dir
      entries:
        nri-memcached:
          kind: file
          copy_from_file: ${nr-sub:packages.nri-memcached.dir}/nri-memcached
