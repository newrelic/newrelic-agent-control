namespace: newrelic
name: com.newrelic.infrastructure
version: 0.1.0
platform: host
operating_system: linux
protocol_version: "1.0"
variables:
  config_agent:
    description: "Newrelic infra configuration"
    type: yaml
    required: false
    default: ""
  config_logging:
    description: "map of logging config file names to their contents"
    type: string_map
    required: false
    default: { }
  backoff_delay:
    description: "seconds until next retry if agent fails to start"
    type: string
    required: false
    default: 20s
  enable_file_logging:
    description: "enable logging the on host executables' logs to files"
    type: bool
    required: false
    default: false
  health_port:
    description: "port for the Infra Agent status server"
    type: number
    required: false
    default: 18003
  oci:
    repository:
      description: "Package repository name"
      type: string
      required: false
      default: newrelic/infrastructure-agent-artifacts
      variants:
        ac_config_field: "oci_repository_urls"
        values: [ "newrelic/infrastructure-agent-artifacts" ]
  version:
    description: "Agent version"
    type: string
    required: true
  nrjmx:
    version:
      description: "nrjmx version"
      type: string
      required: true
    oci:
      repository:
        description: "OCI repository name for nrjmx"
        type: string
        required: false
        default: newrelic/nrjmx-artifacts
        variants:
          ac_config_field: "oci_repository_urls"
          values: [ "newrelic/nrjmx-artifacts" ]
deployment:
  enable_file_logging: ${nr-var:enable_file_logging}
  health:
    interval: 30s
    initial_delay: 60s
    timeout: 5s
    checks:
      - kind: Process
      - kind: Http
        path: "/v1/status/health"
        port: ${nr-var:health_port}
  reported_version_package: infra-agent
  packages:
    infra-agent:
      download:
        oci:
          repository: ${nr-var:oci.repository}
          version: ${nr-var:version}
          public_key_url: https://publickeys.newrelic.com/g/agent-control-oci/global/nrinfraagent/jwks.json
    nrjmx:
      download:
        oci:
          repository: ${nr-var:nrjmx.oci.repository}
          version: ${nr-var:nrjmx.version}
          public_key_url: https://publickeys.newrelic.com/g/agent-control-oci/global/nrjmx/jwks.json
  filesystem:
    config:
      kind: dir
      entries:
        newrelic-infra.yaml:
          kind: file
          text: |
            ${nr-var:config_agent}
    logging.d:
      kind: dir_content_from_map
      source: ${nr-var:config_logging}
    # Agent data root (NRIA_AGENT_DIR).
    newrelic-infra:
      kind: dir
      entries:
        tmp:
          kind: dir
  shared_filesystem:
    # OHIs config folders.
    # infra-agent is configured through NRIA_PLUGIN_DIR, to read configs from this folder.
    infra-agent-ohi-configs:
      kind: dir
      entries:
        docker-config.yml:
          kind: file
          text: |
            integrations:
            - name: nri-docker
              when:
                feature: docker_enabled
                file_exists: /var/run/docker.sock
              interval: 15s
    # OHIs binaries folder.
    # infra-agent is configured through NRIA_CUSTOM_PLUGIN_INSTALLATION_DIR and NRIA_SAFE_BIN_DIR,
    # to read binaries from this folder.
    infra-agent-ohi-binaries:
      kind: dir
      entries:
        nri-docker:
          kind: file
          copy_from_file: ${nr-sub:packages.infra-agent.dir}/integrations/nri-docker
        nri-prometheus:
          kind: file
          copy_from_file: ${nr-sub:packages.infra-agent.dir}/integrations/nri-prometheus
    # nrjmx binary, a JMX bridge used by JMX-based OHIs.
    # Integrations that need it should declare NR_JMX_TOOL pointing to this folder's nrjmx binary.
    jmx-tool:
      kind: dir
      entries:
        nrjmx:
          kind: file
          copy_from_file: ${nr-sub:packages.nrjmx.dir}/nrjmx
  executables:
    - id: newrelic-infra
      path: ${nr-sub:packages.infra-agent.dir}/newrelic-infra
      args:
        - --config
        - ${nr-sub:filesystem_agent_dir}/config/newrelic-infra.yaml
      env:
        # NRIA_AGENT_DIR is needed in order to change the root directory for the agent data on Linux.
        # This is useful to make sure that all the data generated by the agent is stored inside the AC managed filesystem directory.
        # Otherwise, a user could write data to a folder with lower permissions and potentially escalate privileges.
        # For the same reason we are also changing the location of the integration binaries.
        NRIA_AGENT_DIR: "${nr-sub:filesystem_agent_dir}/newrelic-infra"
        NRIA_AGENT_TEMP_DIR: "${nr-sub:filesystem_agent_dir}/newrelic-infra/tmp"
        NRIA_CUSTOM_PLUGIN_INSTALLATION_DIR: "${nr-sub:shared_filesystem_dir}/infra-agent-ohi-binaries"
        NRIA_SAFE_BIN_DIR: "${nr-sub:shared_filesystem_dir}/infra-agent-ohi-binaries"
        # Config folders where integrations and logging configs parsed from local/remote values are stored and looked for.
        NRIA_PLUGIN_DIR: "${nr-sub:shared_filesystem_dir}/infra-agent-ohi-configs"
        NRIA_LOGGING_CONFIGS_DIR: "${nr-sub:filesystem_agent_dir}/logging.d"
        # Where parsers.conf and out_newrelic.so are placed and fb.db will be created
        NRIA_LOGGING_HOME_DIR: "${nr-sub:packages.infra-agent.dir}/logging"
        # NRIA_LOGGING_BIN_DIR is not added because it continues being installed with apt, yum, zypp in its current location.
        NRIA_STATUS_SERVER_ENABLED: true
        NRIA_STATUS_SERVER_PORT: "${nr-var:health_port}"
        NR_HOST_ID: "${nr-ac:host_id}"
      restart_policy:
        backoff_strategy:
          type: fixed
          backoff_delay: ${nr-var:backoff_delay}
