namespace: newrelic
name: com.newrelic.ebpf
version: 0.1.0
platform: host
operating_system: linux
protocol_version: "1.0"
variables:
  config:
    description: "ebpf configuration"
    type: yaml
    required: true
  backoff_delay:
    description: "seconds until next retry if agent fails to start"
    type: string
    required: false
    default: 20s
  enable_file_logging:
    description: "enable logging the on host executables' logs to files"
    type: bool
    required: false
    default: false
  oci:
    repository:
      description: "Package repository name"
      type: string
      required: false
      default: newrelic/ebpf-agent-artifacts
      variants:
        ac_config_field: "oci_repository_urls"
        values: [ "newrelic/ebpf-agent-artifacts" ]
  version:
    description: "Agent version"
    type: string
    required: true
deployment:
  enable_file_logging: ${nr-var:enable_file_logging}
  packages:
    ebpf-agent:
      download:
        oci:
          repository: ${nr-var:oci.repository}
          version: ${nr-var:version}
          public_key_url: https://publickeys.newrelic.com/g/agent-control-oci/global/nrebpfagent/jwks.json
      post_download_hook:
        path: /bin/bash
        args:
          - post_download.sh
  filesystem:
    newrelic-ebpf-agent.yaml:
      kind: file
      text: |
        ${nr-var:config}
  executables:
    - id: nr-ebpf-agent
      path: ${nr-sub:packages.ebpf-agent.dir}/nr-ebpf-agent
      env:
        NEW_RELIC_LICENSE_KEY: "${nr-env:NEW_RELIC_LICENSE_KEY}"
        NEW_RELIC_CONFIG_PATH: "${nr-sub:filesystem_agent_dir}/newrelic-ebpf-agent.yaml"
      restart_policy:
        backoff_strategy:
          type: fixed
          backoff_delay: ${nr-var:backoff_delay}
