name: TEMP branch on-host E2E

# TEMPORARY: delete before merging.
# Runs the nightly on-host E2E on pushes to this branch only. No Slack, no S3, no image, no canaries.

on:
  push:
    branches:
      - fix/e2e-windows-nrjmx-binaries

permissions:
  contents: read
  actions: read

jobs:
  onhost-e2e:
    uses: ./.github/workflows/component_onhost_e2e.yml
    with:
      caller_workflow: tmp-branch-e2e
    secrets:
      NR_SYSTEM_IDENTITY_CLIENT_ID: ${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_CLIENT_ID }}
      NR_SYSTEM_IDENTITY_PRIVATE_KEY: ${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_PRIVATE_KEY }}
      E2E_ACCOUNT_ID: ${{ secrets.AC_PROD_E2E_ACCOUNT_ID }}
      E2E_API_KEY: ${{ secrets.AC_PROD_E2E_API_KEY }}
      E2E_LICENSE_KEY: ${{ secrets.AC_PROD_E2E_LICENSE_KEY }}
      EU_NR_SYSTEM_IDENTITY_CLIENT_ID: ${{ secrets.AC_PROD_EU_E2E_NR_SYSTEM_IDENTITY_CLIENT_ID }}
      EU_NR_SYSTEM_IDENTITY_PRIVATE_KEY: ${{ secrets.AC_PROD_EU_E2E_NR_SYSTEM_IDENTITY_PRIVATE_KEY }}
      EU_E2E_ACCOUNT_ID: ${{ secrets.AC_PROD_EU_E2E_ACCOUNT_ID }}
      EU_E2E_API_KEY: ${{ secrets.AC_PROD_EU_E2E_API_KEY }}
      EU_E2E_LICENSE_KEY: ${{ secrets.AC_PROD_EU_E2E_LICENSE_KEY }}
      JP_NR_SYSTEM_IDENTITY_CLIENT_ID: ${{ secrets.AC_PROD_JP_E2E_NR_SYSTEM_IDENTITY_CLIENT_ID }}
      JP_NR_SYSTEM_IDENTITY_PRIVATE_KEY: ${{ secrets.AC_PROD_JP_E2E_NR_SYSTEM_IDENTITY_PRIVATE_KEY }}
      JP_E2E_ACCOUNT_ID: ${{ secrets.AC_PROD_JP_E2E_ACCOUNT_ID }}
      JP_E2E_API_KEY: ${{ secrets.AC_PROD_JP_E2E_API_KEY }}
      JP_E2E_LICENSE_KEY: ${{ secrets.AC_PROD_JP_E2E_LICENSE_KEY }}
