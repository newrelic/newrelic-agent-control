name: 📞 Build container images

# This workflow compiles the agent control binary in all supported architectures
# build the multi-arch image and push it to the repo packages registry.  

on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Image tag'
        type: string
        required: true
      ac-version:
        description: 'Agent Control version to embed in the binary'
        type: string
        required: true
      push:
        description: 'Push image'
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: Build/Push images
    env:
      DOCKER_IMAGE_NAME_AGENT_CONTROL: newrelic/newrelic-agent-control
      DOCKER_IMAGE_NAME_AGENT_CONTROL_CLI: newrelic/newrelic-agent-control-cli
      DOCKER_PLATFORMS: "linux/amd64,linux/arm64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install-rust-toolchain
        with:
          targets: >-
            aarch64-unknown-linux-musl,
            x86_64-unknown-linux-musl

      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - uses: ./.github/actions/rust-cache
        with:
          identifier: 'release'
          restore-strategy: 'nearest'
          save-cache: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-zigbuild@0.20.1

      - name: Build Agent Control for K8s
        env:
          AGENT_CONTROL_VERSION: ${{ inputs.ac-version }}
        run: |
          make build-agent-control-k8s ARCH=arm64 PKG=newrelic_agent_control
          make build-agent-control-k8s ARCH=amd64 PKG=newrelic_agent_control
          
          # We do not do it in parallel because most of the dependencies are shared
          make build-agent-control-k8s-cli ARCH=arm64 PKG=newrelic_agent_control
          make build-agent-control-k8s-cli ARCH=amd64 PKG=newrelic_agent_control

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.35.0

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ secrets.OHAI_DOCKER_HUB_ID }}
          password: ${{ secrets.OHAI_DOCKER_HUB_PASSWORD }}

      - name: Build images (push=${{ inputs.push }})
        run: |
          make image/agent-control image/agent-control-cli \
            DOCKER_PLATFORMS=$DOCKER_PLATFORMS \
            IMAGE_TAG=${{ inputs.image-tag }} \
            PUSH=${{ inputs.push }} \
            LOAD=false \
            ATTEST=true \
            DOCKER_IMAGE_NAME_AGENT_CONTROL=$DOCKER_IMAGE_NAME_AGENT_CONTROL \
            DOCKER_IMAGE_NAME_AGENT_CONTROL_CLI=$DOCKER_IMAGE_NAME_AGENT_CONTROL_CLI
