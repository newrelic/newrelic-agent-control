name: 'Send Warning Notification via Slack'

on:
  workflow_call:
    inputs:
      message:
        description: 'The message to include in the Slack notification'
        required: true
        type: string
    secrets:
      slack_webhook_url:
        description: 'Slack webhook URL (optional; falls back to AC_SLACK_WEBHOOK via secrets: inherit)'
        required: false

permissions:
  contents: read

jobs:
  send-slack-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure via Slack (AC channel)
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.slack_webhook_url || secrets.AC_SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: [${{ inputs.message }}] @hero check <${{ env.GITHUB_JOB_URL }}>"
            }
        env:
          GITHUB_JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
