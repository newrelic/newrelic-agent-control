name: 🐤 Plan onhost canaries infrastructure changes

on:
  push:
    paths:
      - test/onhost-canaries/terraform/**
      - test/onhost-canaries/Makefile
      - test/terraform/modules/nr_alerts/**
      - Makefile
      - .github/workflows/component_onhost_canaries.yml
      - .github/workflows/push_pr_onhost_canaries_plan.yml

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: false

jobs:
  onhost_canaries:
    name: infra changes ${{ matrix.environment }}
    uses: ./.github/workflows/component_onhost_canaries_infra.yml
    strategy:
      matrix:
        include:
          - environment: staging
            fleet_id: ${{ vars.ONHOST_FLEET_ID_STAGING }}
            windows_fleet_id: ${{ vars.ONHOST_WINDOWS_FLEET_ID_STAGING }}
            data_account_id: ${{ vars.FLEET_DATA_ACCOUNT_ID_STAGING }}
          - environment: production
            fleet_id: ${{ vars.ONHOST_FLEET_ID_PRODUCTION }}
            windows_fleet_id: ${{ vars.ONHOST_WINDOWS_FLEET_ID_PRODUCTION }}
            data_account_id: ${{ vars.FLEET_DATA_ACCOUNT_ID_PRODUCTION }}
    permissions:
      # required to oidc AWS
      id-token: write
      contents: read
    with:
      environment: ${{ matrix.environment }}
      operation: plan
      fleet_id: ${{ matrix.fleet_id }}
      windows_fleet_id: ${{ matrix.windows_fleet_id }}
      data_account_id: ${{ matrix.data_account_id }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_VPC_SUBNET: ${{ secrets.AWS_VPC_SUBNET }}
      AC_CANARY_WINDOWS_PASSWORD: ${{ secrets.AC_CANARY_WINDOWS_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.AC_SLACK_WEBHOOK }}
