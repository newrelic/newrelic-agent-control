name: 📞 OnHost E2E tests

on:
  workflow_call:
    secrets:
      NR_SYSTEM_IDENTITY_CLIENT_ID:
        required: false
      NR_SYSTEM_IDENTITY_PRIVATE_KEY:
        required: false
      E2E_ACCOUNT_ID:
        required: true
      E2E_API_KEY:
        required: true
      E2E_LICENSE_KEY:
        required: true

    inputs:
      caller_workflow:
        description: 'Name of the top-level workflow triggering this run, used for NR event reporting'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  on-host-linux-e2e:
    name: OnHost Linux E2E tests (${{ matrix.platform.arch }}) ${{ matrix.group }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-26.04
            environment: linux
        group:
          - ebpf-agent
    steps:
      - name: Record job start time
        run: echo "JOB_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/load-latest-agent-versions

      - uses: ./.github/actions/install-rust-toolchain
      - name: Build e2e-runner binary
        run: cargo build -p e2e-runner
      - name: "Linux e2e ${{ matrix.group }}"
        run: |
          echo "${{ secrets.NR_SYSTEM_IDENTITY_PRIVATE_KEY }}" > /tmp/newrelic-agent-control-priv.key
          sudo ${{ github.workspace }}/target/debug/e2e-runner ${{ matrix.group }} \
            --nr-api-key "${{ secrets.E2E_API_KEY }}" \
            --nr-license-key "${{ secrets.E2E_LICENSE_KEY }}" \
            --nr-account-id "${{ secrets.E2E_ACCOUNT_ID }}" \
            --nr-region "us" \
            --system-identity-client-id "${{ secrets.NR_SYSTEM_IDENTITY_CLIENT_ID }}" \
            --agent-control-private-key "/tmp/newrelic-agent-control-priv.key" \
            --agent-control-version "latest" \
            --recipes-repo-branch "main" \
            --infra-agent-version "${{ env.INFRA_AGENT_VERSION }}" \
            --nrdot-version "${{ env.NRDOT_VERSION }}" \
            --redis-version "${{ env.REDIS_VERSION }}" \
            --apache-version "${{ env.APACHE_VERSION }}" \
            --nginx-version "${{ env.NGINX_VERSION }}" \
            --memcached-version "${{ env.MEMCACHED_VERSION }}" \
            --flex-version "${{ env.FLEX_VERSION }}" \
            --mysql-version "${{ env.MYSQL_VERSION }}" \
            --postgresql-version "${{ env.POSTGRESQL_VERSION }}" \
            --ebpf-agent-version "${{ env.EBPF_AGENT_VERSION }}"

      - name: Report test result to New Relic
        if: always()
        env:
          NR_LICENSE_KEY: ${{ secrets.E2E_LICENSE_KEY }}
          NR_ACCOUNT_ID: ${{ secrets.E2E_ACCOUNT_ID }}
          E2E_SCENARIO: ${{ matrix.group }}
          E2E_ENVIRONMENT: ${{ matrix.platform.environment }}
          E2E_STATUS: ${{ job.status }}
          E2E_CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
        run: bash .github/workflows/scripts/report_e2e_result.sh

      - name: Upload e2e result summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-result-${{ matrix.platform.environment }}-${{ matrix.group }}
          path: e2e-result-*-${{ matrix.platform.environment }}-${{ matrix.group }}.txt
          if-no-files-found: warn
