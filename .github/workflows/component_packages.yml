name: 📞 Build binaries and create packages

# Note: this reusable workflow doesn't define a `permissions` block explicitly because it needs to be called from
# both read-only (such as e2e) and read-write (such as pre-releases) workflows. The corresponding CodeQL alert
# can be dismissed.

on:
  workflow_call:
    secrets:
      gh_token:
        description: 'Github token for uploading packages to release'
        required: false
      gpg_private_key_base64:
        description: 'Private key for signing packages'
        required: false
      gpg_passphrase:
        description: 'Passphrase the GPG private key'
        required: false
      pfx_certificate_base64:
        description: 'Pfx for signing windows executables'
        required: false
      pfx_passphrase:
        description: 'Passphrase of the PFX certificate'
        required: false
      nr_account_id:
        description: 'New Relic account ID for binary size reporting (optional)'
        required: false
      nr_license_key:
        description: 'New Relic license key, Events API ingest key (optional)'
        required: false
      nr_user_api_key:
        description: 'New Relic User API key for the growth check via NerdGraph (optional)'
        required: false
      slack_webhook_url:
        description: 'Slack webhook for binary size growth warnings (optional)'
        required: false
    inputs:
      pre-release:
        description: 'set to true if running a real pre-release'
        type: boolean
        required: true
      skip_sign:
        description: 'skip signing the packages'
        type: boolean
        required: false
        default: false
      tag_name:
        description: 'tag name for the packages'
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and upload
    outputs:
      binary-size-warnings: ${{ steps.binary-size.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install-rust-toolchain
        with:
          targets: >-
            aarch64-unknown-linux-musl,
            x86_64-unknown-linux-musl,
            x86_64-pc-windows-msvc

      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - uses: ./.github/actions/rust-cache
        with:
          identifier: 'release'
          restore-strategy: 'nearest'
          save-cache: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-zigbuild@0.20.1

      - name: Install Windows cross-compilation dependencies
        run: |
          sudo apt-get install -y llvm

      - name: Install cargo-xwin and go-winres
        run: |
          cargo install --locked cargo-xwin --version 0.22.0 --force
          go install github.com/tc-hib/go-winres@v0.3.3

      - name: If pre-release, set tag and verify it matches Cargo.toml version
        if: ${{ inputs.pre-release}}
        run: |
          NEWRELIC_AGENT_CONTROL_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' agent-control/Cargo.toml)
          if [ "${NEWRELIC_AGENT_CONTROL_VERSION}" != "${{ inputs.tag_name }}" ]; then
            echo "Package version specified in Cargo.toml (${NEWRELIC_AGENT_CONTROL_VERSION}) differs from tag (${{ inputs.tag_name }}), exiting"
            exit 1
          fi

      - name: If not pre-release, set override the AC version with the tag and SKIP_UPLOAD_RELEASE=true
        if: ${{ ! inputs.pre-release }}
        run: |
          git tag ${{ inputs.tag_name }}
          echo SKIP_UPLOAD_RELEASE="--skip=publish" >> $GITHUB_ENV

      - name: Skip packages sign
        if: ${{ inputs.skip_sign }}
        run: |
          echo SKIP_SIGN="--skip=sign" >> $GITHUB_ENV
          echo SKIP_WINDOWS_SIGN="true" >> $GITHUB_ENV

      - name: Release packages with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release ${{ env.SKIP_UPLOAD_RELEASE }} ${{ env.SKIP_SIGN }} --clean --verbose --timeout 2h
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.gpg_private_key_base64 }} # base64 encoded
          GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
          PFX_CERTIFICATE_BASE64: ${{ secrets.pfx_certificate_base64 }} # base64 encoded
          PFX_PASSPHRASE: ${{ secrets.pfx_passphrase }}
          GPG_MAIL: 'infrastructure-eng@newrelic.com'
          NR_RELEASE_TAG: ${{ inputs.tag_name }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag_name }}
          SKIP_WINDOWS_SIGN: ${{ env.SKIP_WINDOWS_SIGN }}

      - name: Report binary sizes to New Relic
        id: binary-size
        env:
          BINARY_VERSION: ${{ inputs.tag_name }}
          NR_ACCOUNT_ID: ${{ secrets.nr_account_id }}
          NR_LICENSE_KEY: ${{ secrets.nr_license_key }}
          NR_USER_API_KEY: ${{ secrets.nr_user_api_key }}
          WARNINGS_FILE: binary-size-warnings.txt
        run: |
          : > "$WARNINGS_FILE"
          for path in dist/*/newrelic-agent-control dist/*/newrelic-agent-control-cli dist/*/newrelic-agent-control.exe dist/*/newrelic-agent-control-cli.exe; do
            [ -f "$path" ] || continue
            export BINARY_PATH="$path"
            bash .github/workflows/scripts/report_binary_size.sh
          done
          if [ -s "$WARNINGS_FILE" ]; then
            {
              echo "warnings<<EOF"
              cat "$WARNINGS_FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to pipeline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 1
          name: built-binaries-${{ inputs.tag_name }}
          path: |
            ./bin/*
            ./dist/*

  notify-binary-size-growth:
    name: Warn on binary size growth
    needs: build
    # Keep this event allow-list in sync with TRACKED_TRIGGER_EVENTS in report_binary_size.sh:
    # only nightly (schedule/workflow_dispatch) and real pre-releases (release) build comparable
    # binaries. Explicit here too so a PR run can never trigger this, even if warnings weren't empty.
    if: |
      needs.build.outputs.binary-size-warnings != '' &&
      contains(fromJSON('["schedule", "workflow_dispatch", "release"]'), github.event_name)
    continue-on-error: true
    uses: ./.github/workflows/component_send_warning_via_slack.yml
    with:
      message: ${{ needs.build.outputs.binary-size-warnings }}
    secrets:
      slack_webhook_url: ${{ secrets.slack_webhook_url }}

  verify-windows-signatures:
    runs-on: windows-latest
    name: Verify Windows signatures
    needs: build
    if: ${{ ! inputs.skip_sign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-binaries-${{ inputs.tag_name }}
          path: ./artifacts

      - name: Verify Windows executable signatures
        shell: powershell
        run: |
          ./build/scripts/windows-exec-sign/verify-signature.ps1 -Executables @(
            "./artifacts/dist/newrelic-agent-control-windows_x86_64-pc-windows-msvc/newrelic-agent-control.exe",
            "./artifacts/dist/newrelic-agent-control-cli-windows_x86_64-pc-windows-msvc/newrelic-agent-control-cli.exe"
          )
