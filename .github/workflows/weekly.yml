name: Weekly

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Scheduled to run at 6 a.m on mondays.
    - cron: "0 6 * * 1"

jobs:
  ansible-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ansible
        run: |
          set -e  # Exit immediately if a command exits with a non-zero status

          # Update package list and install ansible
          sudo apt update
          sudo apt install ansible -y

      - name: Create system identity file
        run: |
          DEST_DIR="/tmp/newrelic-agent-control"
          DEST_FILE="$DEST_DIR/priv.key"

          if [ ! -d "$DEST_DIR" ]; then
            mkdir -p "$DEST_DIR"
          fi

          echo "${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_PRIVATE_KEY }}" > "$DEST_FILE"

      - name: Install New Relic ansible module
        run: |
          # Install New Relic Ansible module
          ansible-galaxy install newrelic.newrelic_install

      - name: Create and apply Ansible playbook
        run: |
          # Create ansible playbook file
          cat <<EOF > playbook.yaml
          - name: Install New Relic infrastructure
            hosts: all
            roles:
              - role: newrelic.newrelic_install
            vars:
              targets:
                - agent-control
              verbosity: debug
            environment:
              NEW_RELIC_API_KEY: ${{ secrets.AC_PROD_E2E_API_KEY }}
              NEW_RELIC_ACCOUNT_ID: "${{ secrets.AC_PROD_E2E_ACCOUNT_ID }}"
              NEW_RELIC_REGION: US
              NEW_RELIC_CLI_SKIP_CORE: "true"
              # ac-e2e-no-deployment
              NR_CLI_FLEET_ID : "${{ vars.LINUX_FLEET_ID_EMPTY_DEPLOYMENT }}"
              NEW_RELIC_AUTH_PROVISIONED_CLIENT_ID : "${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_CLIENT_ID }}"
              NEW_RELIC_AUTH_PRIVATE_KEY_PATH : "/tmp/newrelic-agent-control/priv.key"
              NEW_RELIC_AGENT_CONTROL_PROXY_URL : ""
              NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_DIR : ""
              NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_FILE : ""
              NEW_RELIC_AGENT_CONTROL_PROXY_IGNORE_SYSTEM : "false"
          EOF

          ansible-playbook playbook.yaml -i "localhost," --connection=local > output.log 2>&1

      - name: Check for successful installation
        run: |
          if grep -qE "Agent Control\s*\(installed\)" output.log; then
            echo "Installation successful: Agent Control is installed."
          else
            echo "Installation failed: Agent Control is not installed."
            exit 1
          fi

      - name: Print Ansible output on failure
        if: failure()
        run: cat output.log

      - name: Print cli logs
        if: failure()
        run: cat /tmp/newrelic-cli-debug.log

  puppet-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Puppet
        run: |
          set -e  # Exit immediately if a command exits with a non-zero status

          # Download and install Puppet release package
          wget https://apt.puppet.com/puppet8-release-jammy.deb
          sudo dpkg -i puppet8-release-jammy.deb

          # Update package list and install Puppet agent
          sudo apt update
          sudo apt -y install puppet-agent

          # Verify Puppet installation
          /opt/puppetlabs/bin/puppet --version

      - name: Install New Relic Puppet module
        run: |
          # Install New Relic Puppet module
          sudo /opt/puppetlabs/bin/puppet module install newrelic-newrelic_installer --modulepath /etc/puppet/modules

      - name: Create system identity file
        run: |
          DEST_DIR="/tmp/newrelic-agent-control"
          DEST_FILE="$DEST_DIR/priv.key"

          if [ ! -d "$DEST_DIR" ]; then
            mkdir -p "$DEST_DIR"
          fi

          echo "${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_PRIVATE_KEY }}" > "$DEST_FILE"

      - name: Create and apply Puppet catalog
        run: |
          # Create Puppet catalog file
          cat <<EOF > nr.pp
          class { 'newrelic_installer::install':
            targets => [
            'agent-control'
            ],
            # See all available targets at: https://github.com/newrelic/puppet-install
            environment_variables => {
            "NEW_RELIC_API_KEY"    => "${{ secrets.AC_PROD_E2E_API_KEY }}",
            "NEW_RELIC_ACCOUNT_ID" => "${{ secrets.AC_PROD_E2E_ACCOUNT_ID }}",
            "NEW_RELIC_REGION"     => "US",
            "NEW_RELIC_CLI_SKIP_CORE" => "true",
            # ac-e2e-no-deployment
            "NR_CLI_FLEET_ID" => "${{ vars.LINUX_FLEET_ID_EMPTY_DEPLOYMENT }}",
            "NEW_RELIC_AUTH_PROVISIONED_CLIENT_ID" => "${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_CLIENT_ID }}",
            "NEW_RELIC_AUTH_PRIVATE_KEY_PATH" => "/tmp/newrelic-agent-control/priv.key",
            "NEW_RELIC_AGENT_CONTROL_PROXY_URL" => "",
            "NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_DIR" => "",
            "NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_FILE" => "",
            "NEW_RELIC_AGENT_CONTROL_PROXY_IGNORE_SYSTEM" => "false"
            }
          }
          EOF

          sudo /opt/puppetlabs/bin/puppet apply nr.pp --modulepath=/etc/puppet/modules --debug | tee output.log

      - name: Check for successful installation
        run: |
          if grep -qE "Agent Control\s*\(installed\)" output.log; then
            echo "Installation successful: Agent Control is installed."
          else
            echo "Installation failed: Agent Control is not installed."
            exit 1
          fi

      - name: Print Puppet output on failure
        if: failure()
        run: cat output.log

      - name: Print cli logs
        if: failure()
        run: cat /tmp/newrelic-cli-debug.log

  chef-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up and execute Chef installation
        run: |
          set -e  # Exit immediately if a command exits with a non-zero status

          # Download and install Cinc (Chef)
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash

          # Download and unpack newrelic-install cookbook
          wget https://supermarket.chef.io/cookbooks/newrelic-install/download -O newrelic-install.tar.gz
          mkdir cookbooks
          tar -xzf newrelic-install.tar.gz -C cookbooks/.

      - name: Create system identity file
        run: |
          DEST_DIR="/tmp/newrelic-agent-control"
          DEST_FILE="$DEST_DIR/priv.key"

          if [ ! -d "$DEST_DIR" ]; then
            mkdir -p "$DEST_DIR"
          fi

          echo "${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_PRIVATE_KEY }}" > "$DEST_FILE"

      - name: Edit and install Chef recipe
        run: |
          # Edit Chef newrelic-install default attributes file with required fields
          sed -i '/curl -Ls https:\/\/download.newrelic.com\/install\/newrelic-cli\/scripts\/install.sh/{s/newrelic install/newrelic install --debug/}' cookbooks/newrelic-install/resources/newrelic_install.rb
          cat <<EOF > cookbooks/newrelic-install/attributes/default.rb
          default['newrelic_install']['NEW_RELIC_API_KEY'] = '${{ secrets.AC_PROD_E2E_API_KEY }}'
          default['newrelic_install']['NEW_RELIC_ACCOUNT_ID'] = '${{ secrets.AC_PROD_E2E_ACCOUNT_ID }}'
          default['newrelic_install']['NEW_RELIC_REGION'] = 'US'
          default['newrelic_install']['targets'] = [
            'agent-control'
          ]
          default['newrelic_install']['env']['NEW_RELIC_CLI_SKIP_CORE'] = '1'
          default['newrelic_install']['env']['NEW_RELIC_AUTH_PROVISIONED_CLIENT_ID']='${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_CLIENT_ID }}'
          default['newrelic_install']['env']['NEW_RELIC_AUTH_PRIVATE_KEY_PATH']='/tmp/newrelic-agent-control/priv.key'
          # ac-e2e-no-deployment
          default['newrelic_install']['env']['NR_CLI_FLEET_ID']='${{ vars.LINUX_FLEET_ID_EMPTY_DEPLOYMENT }}'
          default['newrelic_install']['env']['NEW_RELIC_AGENT_CONTROL_PROXY_URL']=''
          default['newrelic_install']['env']['NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_DIR']=''
          default['newrelic_install']['env']['NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_FILE']=''
          default['newrelic_install']['env']['NEW_RELIC_AGENT_CONTROL_PROXY_IGNORE_SYSTEM']='false'
          EOF

          # Execute newrelic install
          sudo chef-client --local-mode --runlist 'recipe[newrelic-install::default]'
          sudo chef-client --local-mode --runlist 'recipe[newrelic-install::default]' > output.log 2>&1

      - name: Check for successful installation
        run: |
          if grep -qE "Agent Control\s*\(installed\)" output.log; then
            echo "Installation successful: Agent Control is installed."
          else
            echo "Installation failed: Agent Control is not installed."
            exit 1
          fi

      - name: Print Chef output on failure
        if: failure()
        run: cat output.log

      - name: Print cli logs
        if: failure()
        run: cat /tmp/newrelic-cli-debug.log

  k8s-e2e-tests-latest-flux:
    uses: ./.github/workflows/component_k8s_e2e.yml
    with:
      # TODO
      # Enable ebpf test back once we manage to run the e2e.
      # Context:
      # We were using version 0.2.6, which downloaded the linux headers from an s3 bucket in staging.
      # This is no longer true and newer versions don't work out of the box.
      scenarios: '["apm", "collector", "fleet-control", "dynamic"]'
      use_latest_flux: true
      caller_workflow: latest_flux_e2e
    secrets:
      NR_SYSTEM_IDENTITY_CLIENT_ID: ${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_CLIENT_ID }}
      NR_SYSTEM_IDENTITY_PRIVATE_KEY: ${{ secrets.AC_PROD_E2E_NR_SYSTEM_IDENTITY_PRIVATE_KEY }}
      E2E_ACCOUNT_ID: ${{ secrets.AC_PROD_E2E_ACCOUNT_ID }}
      E2E_API_KEY: ${{ secrets.AC_PROD_E2E_API_KEY }}
      E2E_LICENSE_KEY: ${{ secrets.AC_PROD_E2E_LICENSE_KEY }}

  notify-failure:
    # Notify ONLY on scheduled un-attended executions, once, regardless of how many jobs failed.
    if: ${{ always() && failure() && github.event_name != 'workflow_dispatch' && github.run_attempt == '1' }}
    needs: [ansible-install, puppet-install, chef-install, k8s-e2e-tests-latest-flux]
    uses: ./.github/workflows/component_send_warning_via_slack.yml
    with:
      message: "Weekly workflow failed (ansible: ${{ needs.ansible-install.result }}, puppet: ${{ needs.puppet-install.result }}, chef: ${{ needs.chef-install.result }}, flux e2e: ${{ needs.k8s-e2e-tests-latest-flux.result }})"
    secrets: inherit
