name: Nix cache GC

# Garbage collection for the Hestia Nix cache used by nix.yml. It has to run on the default
# branch, the only place that sees the shared cache. Without it the repository's Actions cache
# quota fills up and GitHub's own eviction takes over.

on:
  schedule:
    # Daily, off-peak (UTC).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false

# A second run would race the first one's repack, so queue instead of overlapping.
concurrency:
  group: nix-cache-gc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gc:
    name: garbage collect
    runs-on: ubuntu-latest
    permissions:
      # Deleting caches through the REST API needs actions: write.
      actions: write
      contents: read
    steps:
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      - name: Run garbage collection
        run: '"${HESTIA_BIN:-hestia}" gc ${{ inputs.dry-run && ''--dry-run'' || '''' }}'
        env:
          GITHUB_TOKEN: ${{ github.token }}
