# This action requires that any PR should touch the CHANGELOG file or add a change file in `.changelog/`.
#
# The release notes generation process relies on the CHANGELOG file and on the change files (one YAML file per change)
# that the release-toolkit can parse.
# Each PR that introduces a change worth to be included in the release notes should include an update to the CHANGELOG
# file or a change file.
#
# Skip conditions:
#   - PR has the 'dependencies' label (changelog entries are automatically generated for dependency updates)
#   - Branch name starts with 'renovate/'
#   - PR has the 'skip-changelog' label
name: 📞 Check changelog


# This workflows is used by external repositories
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      ${{
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
        !startsWith(github.head_ref, 'renovate/')
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for CHANGELOG file or change file changes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "origin/${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}" | grep --ignore-case -q CHANGELOG.md
          then
            echo "The CHANGELOG file was modified."
          elif git diff --name-only --diff-filter=AMR "origin/${{ github.base_ref }}" -- .changelog | grep -v -E '(^|/)TEMPLATE\.ya?ml$' | grep -q .
          then
            echo "A change file was added or modified."
          else
            echo "Neither the CHANGELOG file nor a change file was modified."
            echo "Please add a CHANGELOG entry to the appropriate header under \"Unreleased\", or a change file in .changelog/ (copy .changelog/TEMPLATE.yaml), or add the \"skip-changelog\" label if not required."
            false
          fi

      # A directory that does not exist has no change files, so this passes if none is used.
      - name: Check if the change files are valid
        id: validate-changes
        uses: newrelic/release-toolkit/validate-changes@c07dd843317d8229f6e00272a976926306c261e2 # v1.7.0

      - name: Get CHANGELOG from the latest release
        run: |
          latest_tag=$(git describe --tags --abbrev=0 HEAD^)
          echo "Comparing against latest release tag: ${latest_tag}"
          git show "${latest_tag}:CHANGELOG.md" > CHANGELOG.base.md

      - name: Check if CHANGELOG is valid
        id: validate-changelog
        uses: newrelic/release-toolkit/validate-markdown@c07dd843317d8229f6e00272a976926306c261e2 # v1.7.0
        with:
          previous-markdown: CHANGELOG.base.md

      - name: Print expected change file format
        if: failure() && steps.validate-changes.conclusion == 'failure'
        run: |
          echo "Expected format for each file in '.changelog/' (copy .changelog/TEMPLATE.yaml):

            type: bugfix
            message: Description of the change in a single line.

          type is one of: breaking | security | enhancement | bugfix | dependency"

      - name: Print expected CHANGELOG format
        if: failure() && steps.validate-changelog.conclusion == 'failure'
        run: |
          echo "Expected format for the '## Unreleased' section:

            ## Unreleased

            ### breaking
            - Description of a breaking change.

            ### security
            - Description of a security fix.

            ### enhancement
            - Description of a new feature.

            ### bugfix
            - Description of a fix.

          Note: only include the subsections relevant to your change."
