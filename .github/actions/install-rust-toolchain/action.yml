name: 'Install Rust Toolchain'
description: 'Installs the Rust toolchain version specified in Cargo.toml'
inputs:
  cargo-toml:
    description: 'Path to the Cargo.toml that declares the Rust version'
    required: false
    default: 'Cargo.toml'
  targets:
    description: 'Comma-separated list of additional targets to install'
    required: false
  components:
    description: 'Comma-separated list of additional components to install'
    required: false
runs:
  using: "composite"
  steps:
    - name: Obtain Rust version from project
      shell: bash
      env:
        CARGO_TOML: ${{ inputs.cargo-toml }}
      run: |
        RUST_VERSION=$(grep "rust-version" "$CARGO_TOML" | cut -d "=" -f2 | tr -d "[:space:]\"'")
        echo "RUST_VERSION=${RUST_VERSION}" >> $GITHUB_ENV

    - name: Install Rust ${{ env.RUST_VERSION }}
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
