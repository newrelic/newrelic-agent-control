name: 'Test OHI agent'
description: >
  Installs Agent Control and the infrastructure agent on the runner, deploys the provided agent via local config
  (agent type, package and config served from a local OCI registry) and asserts on the given NRQL.
inputs:
  agent-type-file:
    description: 'Agent type definition file path (YAML) for the runner OS.'
    required: true
  package-file:
    description: 'Final package archive path (.tar.gz, .tgz or .zip) for the runner OS.'
    required: true
  config-file:
    description: 'Local config file path of the agent. It must not set `version` or `oci`; the action injects them.'
    required: true
  nrql-assertion:
    description: 'NRQL that must return a meaningful value. It must contain `{{test_id}}`, replaced with the id of this run.'
    required: true
  nr-license-key:
    description: 'New Relic license key used by the infrastructure agent.'
    required: true
  nr-api-key:
    description: 'New Relic user API key used to run the NRQL assertion.'
    required: true
  nr-account-id:
    description: 'New Relic account id.'
    required: true
  nr-region:
    description: 'New Relic region: us, eu, jp or staging.'
    required: false
    default: 'us'
runs:
  using: "composite"
  steps:
    - name: Require a Linux or Windows runner
      if: runner.os != 'Linux' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "::error::This action only supports Linux and Windows runners, got ${{ runner.os }}"
        exit 1

    - name: Locate the Agent Control checkout
      shell: bash
      run: |
        # `pwd -W` prints a native path on Windows (Git Bash); plain `pwd` elsewhere
        echo "AC_REPO_ROOT=$(cd "${{ github.action_path }}/../../.." && { pwd -W 2>/dev/null || pwd; })" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=${{ runner.temp }}/ohi-agent-runner-target" >> "$GITHUB_ENV"

    - uses: newrelic/newrelic-agent-control/.github/actions/install-rust-toolchain@main
      with:
        cargo-toml: ${{ env.AC_REPO_ROOT }}/Cargo.toml

    - uses: newrelic/newrelic-agent-control/.github/actions/agent-versions/load@main
      id: agent-versions

    - name: Build the e2e-runner
      shell: bash
      run: cargo build --manifest-path "$AC_REPO_ROOT/Cargo.toml" -p e2e-runner

    - name: Run the OHI agent scenario (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # Inputs go through the environment, not inline in the script: the NRQL has backticks that bash would run.
      env:
        NR_LICENSE_KEY: ${{ inputs.nr-license-key }}
        NR_API_KEY: ${{ inputs.nr-api-key }}
        NR_ACCOUNT_ID: ${{ inputs.nr-account-id }}
        NR_REGION: ${{ inputs.nr-region }}
        AGENT_TYPE_FILE: ${{ inputs.agent-type-file }}
        PACKAGE_FILE: ${{ inputs.package-file }}
        CONFIG_FILE: ${{ inputs.config-file }}
        NRQL_ASSERTION: ${{ inputs.nrql-assertion }}
        AGENT_METADATA: ${{ steps.agent-versions.outputs.json }}
      run: |
        sudo --preserve-env=AGENT_METADATA "$CARGO_TARGET_DIR/debug/e2e-runner" --log-level info ohi-agent \
          --agent-type-file "$AGENT_TYPE_FILE" \
          --package-file "$PACKAGE_FILE" \
          --config-file "$CONFIG_FILE" \
          --nrql-assertion "$NRQL_ASSERTION" \
          --nr-license-key "$NR_LICENSE_KEY" \
          --nr-api-key "$NR_API_KEY" \
          --nr-account-id "$NR_ACCOUNT_ID" \
          --nr-region "$NR_REGION"

    # Windows runners run as an administrator, so no privilege elevation is needed.
    - name: Run the OHI agent scenario (Windows)
      if: runner.os == 'Windows'
      shell: bash
      # Inputs go through the environment, not inline in the script: the NRQL has backticks that bash would run.
      env:
        NR_LICENSE_KEY: ${{ inputs.nr-license-key }}
        NR_API_KEY: ${{ inputs.nr-api-key }}
        NR_ACCOUNT_ID: ${{ inputs.nr-account-id }}
        NR_REGION: ${{ inputs.nr-region }}
        AGENT_TYPE_FILE: ${{ inputs.agent-type-file }}
        PACKAGE_FILE: ${{ inputs.package-file }}
        CONFIG_FILE: ${{ inputs.config-file }}
        NRQL_ASSERTION: ${{ inputs.nrql-assertion }}
        AGENT_METADATA: ${{ steps.agent-versions.outputs.json }}
      run: |
        "$CARGO_TARGET_DIR/debug/e2e-runner.exe" --log-level info ohi-agent \
          --agent-type-file "$AGENT_TYPE_FILE" \
          --package-file "$PACKAGE_FILE" \
          --config-file "$CONFIG_FILE" \
          --nrql-assertion "$NRQL_ASSERTION" \
          --nr-license-key "$NR_LICENSE_KEY" \
          --nr-api-key "$NR_API_KEY" \
          --nr-account-id "$NR_ACCOUNT_ID" \
          --nr-region "$NR_REGION"
