name: Agent versions
description: >
  `mode: resolve` queries Instrumentation Metadata (IM) and uploads the raw data as an artifact.
  `mode: load` downloads the latest resolved artifact, selects the latest agent and agent-type
  versions for one platform, and exports them as env vars for every agent type in IM, named after the
  uppercased IM agent type (`NRINFRA_VERSION` for the package, `NRINFRA_AT_VERSION` for the agent type, ...).
  Agents with no enabled version or agent-type configuration on the platform are not exported.
  The load mode needs `actions: read` if the calling job sets explicit permissions.
inputs:
  mode:
    description: "`resolve` or `load`"
    required: false
    default: load
  platform:
    description: "load: `linux`, `windows` or `kubernetes`. Defaults to the runner OS (`linux` or `windows`)."
    required: false
    default: ""
  client-id:
    description: "resolve: system identity client id"
    required: false
    default: ""
  private-key:
    description: "resolve: system identity private key (PEM contents)"
    required: false
    default: ""
outputs:
  json:
    description: "load: resolved versions as a JSON array"
    value: ${{ steps.load.outputs.json }}
runs:
  using: composite
  steps:
    - name: Resolve agent versions
      if: inputs.mode == 'resolve'
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        IM_URL: https://instrumentation-metadata.service.newrelic.com/graphql
        OUTPUT_FILE: ${{ runner.temp }}/agent-versions/agent-versions.json
      run: |
        # stderr is discarded so the CLI can never echo key material into the log
        IM_TOKEN=$(printf '%s\n' "$PRIVATE_KEY" | docker run --rm -i \
          newrelic/agent-control-system-identity-registration:0.6.1@sha256:5c2122a8fd921bb743205c268c779e49ba48100168b8aad984eb0d1acf8af800 authenticate \
          --client-id "$CLIENT_ID" --private-key-path /dev/stdin \
          --environment US --output-token-format PLAIN 2>/dev/null) || {
          echo "::error::Authentication against New Relic failed"
          exit 1
        }
        if [ -z "$IM_TOKEN" ]; then
          echo "::error::Authentication against New Relic returned an empty token"
          exit 1
        fi
        echo "::add-mask::$IM_TOKEN"
        # the runner masks exact matches only, so mask each JWT segment too
        IFS=. read -ra token_segments <<<"$IM_TOKEN"
        for token_segment in "${token_segments[@]}"; do
          echo "::add-mask::$token_segment"
        done
        export IM_TOKEN
        mkdir -p "$(dirname "$OUTPUT_FILE")"
        "${{ github.action_path }}/resolve.sh"

    - name: Upload artifact
      if: inputs.mode == 'resolve'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: agent-versions
        path: ${{ runner.temp }}/agent-versions/agent-versions.json
        retention-days: 3
        if-no-files-found: error

    - name: Load versions
      id: load
      if: inputs.mode == 'load'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_NAME: agent-versions
        PLATFORM: ${{ inputs.platform }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/load.sh"
