# cargo-nextest configuration: https://nexte.st/docs/configuration/
#
# Each test runs in its own process with its own captured output, so tests run in parallel and a
# failing test's logs (including those of the processes it spawns) are printed together.

[profile.default]
# Report tests running longer than 60s and kill them after 5 minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Run every test to report all failures.
fail-fast = false
