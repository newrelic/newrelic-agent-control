# Cluster and License info is set with "--set" in the e2e-spec file
toolkitImage:
  tag: failIfNotReplaced
agentControlDeployment:
  chartValues:
    image:
      tag: failIfNotReplaced
    subAgentsNamespace: "newrelic-agents"
    verboseLog: true # It is propagated to some agents (same as licenseKey and cluster)
    config:
      authSecret:
        secretName: "agent-control-auth"
        secretKeyName: "private_key"
      fleet_control:
        enabled: false
      log:
        level: debug
      agents:
        infra:
          agent_type: newrelic/com.newrelic.infrastructure:${NRINFRA_AGENT_TYPE_VERSION}
        prometheus:
          agent_type: newrelic/com.newrelic.prometheus:${NRPROMETHEUSAGENT_AGENT_TYPE_VERSION}
        logs:
          agent_type: newrelic/io.fluentbit:${FLUENTBIT_AGENT_TYPE_VERSION}
        gateway:
          agent_type: newrelic/com.newrelic.pipeline_control_gateway:${PIPELINECONTROLGATEWAY_AGENT_TYPE_VERSION}

    agentsConfig:
      infra:
        chart_version: "${NRINFRA_VERSION}"
        chart_values:
          global: # add 'cluster_name' (nri-kubernetes events have 'clusterName' attribute)
            customAttributes:
              cluster_name: ${nr-env:NR_CLUSTER_NAME}
      prometheus:
        chart_version: "${NRPROMETHEUSAGENT_VERSION}"
      logs:
        chart_version: "${FLUENTBIT_VERSION}"
      gateway:
        chart_version: "${PIPELINECONTROLGATEWAY_VERSION}"
        chart_values:
          # we override resources since to fit in the small ci/cd minikube
          gateway:
            # TODO we are currently not testing the gateway behaviour, only that the chart is deployed
            # For this reason we are blocking the creation of pods
            customSecretName: "not-existing"
            customSecretLicenseKey: "not-existing"
            nodeSelector:
              not-existing/os: "not-existing"
