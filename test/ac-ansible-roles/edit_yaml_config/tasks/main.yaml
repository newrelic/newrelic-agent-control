- name: Read the config yaml
  slurp:
    path: "{{ config_path }}"
  register: config_file

- name: extract the config data
  set_fact:
    config: "{{ config_file['content'] | b64decode | from_yaml }}"

- name: Edit the config
  set_fact:
    config: "{{ config | combine(update_config, recursive=True) }}"
  vars:
    update_config: "{{ update_config }}"

- name: Write the modified config (Linux)
  copy:
    content: '{{ config | to_nice_yaml(sort_keys=False) }}'
    dest: "{{ config_path }}"
  when: ansible_os_family != "Windows"

- name: Write the modified config (Windows)
  ansible.windows.win_copy:
    content: '{{ config | to_nice_yaml(sort_keys=False) }}'
    dest: "{{ config_path }}"
  when: ansible_os_family == "Windows"
